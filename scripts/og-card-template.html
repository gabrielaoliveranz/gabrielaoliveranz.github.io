<!DOCTYPE html>
<!--
  Source template for assets/images/og-card.png, the share card for work/index.html.
  Not part of the shipped site. Redesigned 30 Oct 2026. The three figures are part of the
  figure-staleness chain in CLAUDE.md (22,834 · 16,072 · 6 dashboard pages): change them
  only together with the Terroir pipeline and the other copies. Keep the 16px #1A4A82 bar:
  check:og-card counts its pixels against --accent in assets/styles.css.
-->
<html lang="en-NZ"><head><meta charset="utf-8"><title>OG card template, work (not a real page)</title>
<style>@font-face{font-family:"Source Serif 4";font-weight:200 900;src:url("../assets/fonts/source-serif-4-latin.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:italic;font-weight:200 900;src:url("../assets/fonts/source-serif-4-latin-italic.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url("../assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:400 700;src:url("../assets/fonts/source-sans-3-latin.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-weight:500 900;src:url("../assets/fonts/archivo-latin.woff2") format("woff2")}
html,body{margin:0;padding:0}
.card{width:1200px;height:630px;position:relative;overflow:hidden;background:#faf8f3;font-family:"Source Sans 3",sans-serif;color:#201c17}
.card::before{content:"";position:absolute;width:760px;height:760px;right:-220px;top:-180px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(79,195,255,.30),rgba(46,111,176,.14) 45%,transparent 70%);filter:blur(50px)}
/* exact --accent bar: check:og-card counts these pixels */
.bar{position:absolute;left:0;top:0;width:16px;height:100%;background:#1A4A82}
.logo{position:absolute;left:80px;top:56px;height:66px}
.lab{font:500 17px "IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#1a4a82;margin:0}
h1{font:400 66px/1.04 "Source Serif 4",serif;letter-spacing:-.025em;margin:18px 0 0;color:#201c17}
h1 em{font-style:italic;color:#1a4a82}
.lede{font-size:23px;line-height:1.45;color:#5c564a;margin:20px 0 0}

.txt{position:absolute;left:80px;top:178px;width:640px}
h1{font-size:80px}
.stats{position:absolute;left:80px;bottom:62px;display:flex;gap:0;border-top:1px solid #dcd9d0;padding-top:20px}
.stats>div{padding-right:56px}.stats>div+div{padding-left:40px;border-left:1px solid #dcd9d0}
.v{font:400 52px/1 "Source Serif 4",serif;color:#1a4a82;letter-spacing:-.02em}
.l{font:500 14px "IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#5c564a;margin-top:10px}
.ap{position:absolute;right:80px;top:150px;width:360px;background:#fff;border-radius:18px;padding:22px 24px;box-shadow:0 0 0 1px rgba(16,27,46,.06),0 30px 60px -28px rgba(16,27,46,.35)}
.ap .k{font:700 14px "Archivo",sans-serif;letter-spacing:.14em;color:#1a4a82}.ap .s{font-size:16px;color:#5c564a;margin-top:6px}.ap svg{display:block;width:100%;margin-top:14px}.ap .f{display:flex;justify-content:space-between;font:600 15px "Archivo",sans-serif;margin-top:12px}
.ph{position:absolute;right:90px;top:150px;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 30px 60px -30px rgba(16,27,46,.45)}
.ph img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:220px;top:136px;width:28px;height:28px;border-radius:50%;background:#4fc3ff;border:4px solid #faf8f3;z-index:2}
</style></head><body>
<div class="card"><div class="bar"></div>
<img class="logo" src="../assets/images/logo-wordmark.png" alt="">
<div class="txt"><p class="lab">Data analyst · Mount Maunganui</p>
<h1>Gabriela Olivera<em>.</em></h1><p class="lede">Clear answers from messy data.</p></div>
<div class="stats"><div><div class="v">22,834</div><div class="l">parcels analysed</div></div><div><div class="v">16,072</div><div class="l">scored</div></div><div><div class="v">6</div><div class="l">dashboard pages</div></div></div>
<div class="ap"><div class="k">APOPHENIA · RISK</div><div class="s">Export season, 26-week forecast</div>
<svg viewBox="0 0 320 110"><path d="M0 92 L40 84 L80 88 L120 70 L160 74 L200 56 L230 50" fill="none" stroke="#1a4a82" stroke-width="3"/><path d="M230 50 L320 30 L320 10 L230 50Z" fill="#4fc3ff" opacity=".25"/><path d="M230 50 L320 22" fill="none" stroke="#4fc3ff" stroke-width="3" stroke-dasharray="7 6"/><line x1="230" y1="0" x2="230" y2="110" stroke="#c9c6bd" stroke-dasharray="3 4"/></svg>
<div class="f"><span>9 live variables</span><span>4 feeds</span></div></div>
</div></body></html>
