<!DOCTYPE html>
<!--
  Source template for assets/images/og-card-small-business.png, the share card for the
  home page (index.html). The file name is historical (the home page was the small-business
  page until 2026-10-27). Not part of the shipped site. Redesigned 30 Oct 2026 to match the
  consultancy redesign. Keep the 16px #1A4A82 bar: check:og-card counts its pixels against
  --accent in assets/styles.css.
-->
<html lang="en-NZ"><head><meta charset="utf-8"><title>OG card template, home (not a real page)</title>
<style>@font-face{font-family:"Source Serif 4";font-weight:200 900;src:url("../assets/fonts/source-serif-4-latin.woff2") format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:italic;font-weight:200 900;src:url("../assets/fonts/source-serif-4-latin-italic.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url("../assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:400 700;src:url("../assets/fonts/source-sans-3-latin.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-weight:500 900;src:url("../assets/fonts/archivo-latin.woff2") format("woff2")}
html,body{margin:0;padding:0}
.card{width:1200px;height:630px;position:relative;overflow:hidden;background:#faf8f3;font-family:"Source Sans 3",sans-serif;color:#201c17}
.card::before{content:"";position:absolute;width:760px;height:760px;right:-220px;top:-180px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(79,195,255,.30),rgba(46,111,176,.14) 45%,transparent 70%);filter:blur(50px)}
/* exact --accent bar: check:og-card counts these pixels */
.bar{position:absolute;left:0;top:0;width:16px;height:100%;background:#1A4A82}
.logo{position:absolute;left:80px;top:56px;height:66px}
.lab{font:500 17px "IBM Plex Mono",monospace;letter-spacing:.05em;text-transform:uppercase;color:#1a4a82;margin:0}
h1{font:400 66px/1.04 "Source Serif 4",serif;letter-spacing:-.025em;margin:18px 0 0;color:#201c17}
h1 em{font-style:italic;color:#1a4a82}
.lede{font-size:23px;line-height:1.45;color:#5c564a;margin:20px 0 0}

.txt{position:absolute;left:80px;top:178px;width:600px}
.chips{position:absolute;left:80px;bottom:56px;display:flex;gap:12px}
.chip{font:600 16px "Archivo",sans-serif;color:#101b2e;background:#fff;border:1px solid #dcd9d0;border-radius:999px;padding:10px 18px}
.chip b{color:#1a4a82}
.cc{position:absolute;right:70px;top:150px;width:430px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 0 0 1px rgba(16,27,46,.06),0 30px 60px -28px rgba(16,27,46,.35)}
.cc .h{font:600 17px "Archivo",sans-serif}.cc .s{font-size:14px;color:#6a645a;margin-top:2px}
.cc svg{display:block;width:100%;height:auto;margin-top:14px}
.sw{position:absolute;right:120px;top:400px;width:360px;background:#101b2e;color:#e7eef6;border-radius:14px;padding:18px 20px;font-size:18px;line-height:1.4;box-shadow:0 24px 40px -20px rgba(16,27,46,.6)}
.sw b{display:block;font:600 12px "Archivo",sans-serif;letter-spacing:.14em;color:#4fc3ff;margin-bottom:6px}
</style></head><body>
<div class="card"><div class="bar"></div>
<img class="logo" src="../assets/images/logo-wordmark.png" alt="">
<div class="txt"><p class="lab">Data analysis · New Zealand small businesses</p>
<h1>Straight answers from the numbers <em>you already have.</em></h1></div>
<div class="chips"><span class="chip"><b>Fixed price</b>, in writing</span><span class="chip"><b>About 2 weeks</b></span><span class="chip"><b>Private</b>: never in AI tools</span></div>
<div class="cc"><div class="h">Sales trend</div><div class="s">This year vs last year · example business</div>
<svg viewBox="0 0 360 130"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/></linearGradient></defs>
<g stroke="#efeee8"><path d="M0 30H360M0 70H360M0 110H360"/></g>
<path d="M0 100 C40 92 60 96 90 84 S150 70 180 66 S240 52 270 44 S330 30 360 22 V130 H0Z" fill="url(#g)"/>
<path d="M0 106 C40 100 70 104 100 96 S160 86 190 84 S250 74 280 70 S330 62 360 58" fill="none" stroke="#c9c6bd" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M0 100 C40 92 60 96 90 84 S150 70 180 66 S240 52 270 44 S330 30 360 22" fill="none" stroke="#101b2e" stroke-width="3"/>
<circle cx="270" cy="44" r="6" fill="#4fc3ff" stroke="#fff" stroke-width="2"/></svg></div>
<div class="sw"><b>SO WHAT</b>Sales are growing, but one delivery route is eating the margin.</div>
</div></body></html>
